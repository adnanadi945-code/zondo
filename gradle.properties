# AndroidX is required by every dependency in this project (Compose, Hilt, Room,
# Retrofit). Without this property AGP fails :app:checkDebugAarMetadata.
android.useAndroidX=true

# Standard for Android Studio projects: a module only sees the R class of the
# libraries it actually depends on.
android.nonTransitiveRClass=true

org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
